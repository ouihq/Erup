name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["**"]
    paths-ignore: ["**.md", "LICENSE", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE", "docs/**"]
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Override with repository variables when the runner image or Xcode changes.
env:
  RUNNER_IMAGE: ${{ vars.RUNNER_IMAGE || 'macos-26' }}
  XCODE_PATH: ${{ vars.XCODE_PATH || '/Applications/Xcode.app' }}

jobs:
  packages:
    name: Package tests
    runs-on: ${{ vars.RUNNER_IMAGE || 'macos-26' }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_PATH"
      - name: swift test
        run: swift test

  app:
    name: App build and tests
    runs-on: ${{ vars.RUNNER_IMAGE || 'macos-26' }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_PATH"
      - name: Test
        run: >
          xcodebuild -scheme Erup
          -destination 'platform=iOS Simulator,name=iPhone 17'
          -resultBundlePath build/Erup.xcresult
          test CODE_SIGNING_ALLOWED=NO
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/Erup.xcresult

  unsigned-build:
    name: Unsigned device build
    runs-on: ${{ vars.RUNNER_IMAGE || 'macos-26' }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_PATH"
      - name: Build for device
        run: >
          xcodebuild build -scheme Erup -configuration Release -sdk iphoneos
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
