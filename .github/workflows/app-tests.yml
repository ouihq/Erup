name: App tests

# Builds the app and runs its tests on a simulator. Runs on pull requests that touch app code, or by hand.
on:
  pull_request:
    paths: ["App/**", "Sources/**", "Package.swift", "project.yml", "Erup.xcodeproj/**"]
  workflow_dispatch:

concurrency:
  group: app-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: xcodebuild test
    runs-on: ${{ vars.RUNNER_IMAGE || 'macos-26' }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "${{ vars.XCODE_PATH || '/Applications/Xcode.app' }}"
      - name: Test
        run: >
          xcodebuild -scheme Erup
          -destination 'platform=iOS Simulator,name=iPhone 17'
          -resultBundlePath build/Erup.xcresult
          test CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/Erup.xcresult
